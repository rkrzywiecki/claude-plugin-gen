plugin:
  name: java-spring-ops
  version: 0.1.0
  description: >-
    Claude Code plugin dedicated to the Java/Spring Boot + GitLab + GitLab CI
    + Jira + Docker/Compose + git stack. Generated by generate.py from this file.
  author:
    name: Radoslaw Krzywiecki
    email: rkrzywiecki@gmail.com
  homepage: ""
  repository: ""
  license: MIT
  keywords: [java, spring-boot, gitlab, gitlab-ci, jira, docker, docker-compose, git]

# ---------------------------------------------------------------------------
# MCP servers - optional, disabled by default. Set enabled: true + regenerate
# for an entry to land in the generated .mcp.json. Full details always go to
# docs/mcp-integrations.md regardless of enabled.
# ---------------------------------------------------------------------------
mcp_servers:
  - id: gitlab
    enabled: false
    type: http
    url: "https://gitlab.com/api/v4/mcp"
    description: >-
      Official GitLab MCP server - merge requests, pipelines, issues, repo.
      For a self-hosted GitLab, replace the host in the URL with your own instance.

  - id: atlassian
    enabled: false
    type: http
    url: "https://mcp.atlassian.com/v1/mcp/authv2"
    description: >-
      Official Atlassian remote MCP server - Jira and Confluence via OAuth 2.1.

# ---------------------------------------------------------------------------
# Agents
# ---------------------------------------------------------------------------
agents:
  - id: planner
    description: >-
      Breaks a task down into small, testable implementation steps before any
      code gets written. Use PROACTIVELY for anything bigger than a one-line
      fix (a new endpoint, a database migration, a pipeline change).
    tools: [Read, Grep, Glob]
    model: sonnet
    body: |
      # Planner

      You are the planning agent for a Java/Spring Boot + GitLab + Jira +
      Docker stack. Before writing any code, break the task down into steps.

      ## How to work

      1. Read the code the task actually touches (controllers, services,
         repositories, `pom.xml`, `.gitlab-ci.yml`, `docker-compose.yml` -
         whatever the task calls for) before proposing a plan.
      2. Break the task into steps, each one: (a) independently verifiable
         (compiles / test passes / endpoint works), (b) independently
         revertible without unwinding the rest of the plan.
      3. For data-layer changes (new column, type change) always call out
         the migration (Flyway/Liquibase) as its own step - never
         `ddl-auto=update` in production.
      4. For changes touching an external API (an endpoint, a contract),
         note whether it's backward compatible or needs versioning.
      5. If the task references a Jira ticket (e.g. "PROJ-123"), spend one
         sentence on what's ambiguous in the ticket description and would
         need clarifying - don't silently guess business requirements.
      6. You finish with a **plan**, not an implementation - implementation
         only starts after the user approves the plan, unless the task is
         genuinely trivial.

      ## Output format

      A numbered list of steps, each one: what changes + how to verify it
      (`mvn test`, a specific endpoint to check, etc). End with a "Risks"
      section (0-3 bullets, omitted if there genuinely are none).

  - id: spring-reviewer
    description: >-
      Code review for Java/Spring Boot code - layering, dependency injection,
      transaction boundaries, N+1 queries, JPA entities leaking through the
      API instead of DTOs. Use PROACTIVELY after writing or changing code
      under src/main/java.
    tools: [Read, Grep, Glob]
    model: sonnet
    body: |
      # Spring Reviewer

      You review Java/Spring Boot code for quality and adherence to
      framework best practices - not security (that's
      `spring-security-reviewer`'s job).

      ## What to look for

      - **Layering**: does `@RestController` contain business logic or call
        the repository directly instead of delegating to a `@Service`? Do
        `@Repository`/Spring Data interfaces contain business logic?
      - **DTO vs entity**: does the controller return a JPA `@Entity`
        directly instead of a dedicated DTO/record - a common way to leak
        the internal data model and a source of
        `LazyInitializationException` when lazy relations are accessed
        outside the transaction.
      - **Transactions**: is `@Transactional` on the right layer (service,
        not controller or repository)? Is it missing where several writes
        need to be atomic? Is it redundant on read-only methods (should be
        `readOnly = true` there)?
      - **N+1**: a loop over a collection of entities that touches a lazy
        relation (`@OneToMany`/`@ManyToMany`) without `JOIN FETCH` /
        `@EntityGraph` - classic N+1. Point at the exact spot and suggest a
        fetch strategy.
      - **Dependency injection**: prefer constructor injection (as in the
        examples) over field `@Autowired` - easier to test, explicit
        dependencies.
      - **Exceptions**: does a business error surface as an unhandled
        exception to the client (a plain 500 instead of a sensible 4xx) -
        check for a `@ControllerAdvice`/`@ExceptionHandler`.
      - **Validation**: does `@RequestBody` have `@Valid` and Bean
        Validation annotations (`@NotBlank`, `@Size`, ...) instead of manual
        ifs in the controller?

      ## Output format

      A list of findings, each one: file:line (approximate), what's wrong,
      why it matters in practice (not theoretically), a concrete fix (a
      short code snippet if it's brief). Skip pure style with no behavioral
      impact (e.g. import order) - this isn't a linter.

  - id: spring-security-reviewer
    description: >-
      Security review for Spring applications: Spring Security, input
      validation, secret management, CORS/CSRF, OWASP Top 10. Use
      PROACTIVELY for any new endpoint, authentication/authorization logic,
      or handling of payment or other sensitive data.
    tools: [Read, Grep, Glob, Bash]
    model: sonnet
    body: |
      # Spring Security Reviewer

      You're looking for concrete, exploitable security problems - not
      generic advice like "consider adding more security tests".

      ## Checklist

      - **SQL/JPQL injection**: anywhere a query (JdbcTemplate, `@Query`
        with native SQL, `EntityManager.createNativeQuery`) is built by
        string concatenation instead of a bound parameter (`?`, `:name`) -
        this is critical, not a suggestion.
      - **Secrets in code**: `grep -rniE` the repo for patterns like
        `password\s*=\s*"`, `apiKey\s*=\s*"`, `sk_live_`, `AKIA[0-9A-Z]{16}`,
        `-----BEGIN.*PRIVATE KEY-----`. Any hit outside test files with
        clearly fake values is a bug.
      - **Authorization**: do data-mutating endpoints have
        `@PreAuthorize`/`@Secured`/a rule in `SecurityFilterChain` - look
        for endpoints with no access control next to ones that have it
        (inconsistency = likely bug, not a decision).
      - **CORS/CSRF**: `cors().configurationSource(...)` with `*` as the
        allowed origin combined with `allowCredentials(true)` - an invalid
        and dangerous combination. CSRF disabled (`csrf().disable()`) for
        anything other than a pure stateless token-based API.
      - **Input validation**: missing `@Valid`/Bean Validation on
        `@RequestBody`, missing length limits on text fields that flow into
        queries/logs.
      - **Security headers**: does the Security config set
        `HttpOnly`/`Secure`/`SameSite` on session cookies, if sessions are
        used at all.
      - **Dependencies**: if `mvn` is available, you can run
        `mvn -q org.owasp:dependency-check-maven:check` (if the plugin is
        configured), or at least flag anything in `pom.xml` that looks off
        against known CVEs.

      ## Output format

      For each finding: severity (critical/high/medium), file, how it's
      actually exploitable (a concrete payload if it's an injection), and
      the minimal fix.

  - id: build-error-resolver
    description: >-
      Diagnoses and fixes Maven/Gradle build failures - dependency
      conflicts, Java/Spring version mismatches, compilation errors.
    tools: [Read, Bash, Grep]
    model: sonnet
    body: |
      # Build Error Resolver

      You're given a failed Maven/Gradle build. Your job is to find the
      root cause, not the first error message that jumps out (compilation
      errors often cascade from a single source).

      ## How to work

      1. If `Bash` is available, run `mvn -q compile` (or
         `./gradlew compileJava`) and read the FULL output, not just the
         last line - Maven often shows the real cause several lines above
         the final `BUILD FAILURE`.
      2. Dependency conflict (`NoSuchMethodError`, `ClassNotFoundException`
         at runtime despite a successful compile) -> `mvn dependency:tree`
         and look for two versions of the same library. Propose
         `<dependencyManagement>` or an exclusion, not a random version bump.
      3. Spring Boot / Java version mismatch (`release version X not
         supported`) -> check `<java.version>`/`<maven.compiler.release>`
         in `pom.xml` against the actual JDK version (`java -version`).
      4. After a fix, always suggest re-running the build to confirm -
         don't assume success from analysis alone.

      ## Output format

      Brief: what the real cause was (not just the symptom), one concrete
      fix, the command to verify it.

  - id: gitlab-mr-reviewer
    description: >-
      Reviews uncommitted/unmerged changes before opening a GitLab Merge
      Request and drafts the MR description. Use PROACTIVELY before using
      the /mr-prepare command.
    tools: [Read, Bash, Grep, Glob]
    model: sonnet
    body: |
      # GitLab MR Reviewer

      ## How to work

      1. `git diff` (or `git diff <target-branch>...HEAD` if you know the
         target branch) - read the WHOLE diff, not just the file names.
      2. Check the diff only contains what it should (no accidentally
         included `target/`, `.env`, or local IDE config files).
      3. Check the commits have sensible messages (see the `git-workflow`
         skill) - if not, suggest `git rebase -i` to clean up the history
         BEFORE opening the MR, not after.
      4. Return: a list of risky/notable changes (don't duplicate what
         `spring-reviewer`/`spring-security-reviewer` would already catch -
         expect those to be called separately if the change touches Java).
      5. Prepare a **draft MR description**: what and why (not just "what",
         which is obvious from the diff), how it was tested, the linked
         Jira ticket if the branch name/commit suggests one (e.g.
         `PROJ-123-branch-name`).

      ## MR description template (fill in and return)

      ```markdown
      ## What and why

      ## How it was tested

      ## Linked ticket
      Closes PROJ-XXX

      ## Notes for reviewers
      ```

  - id: gitlab-pipeline-debugger
    description: >-
      Analyzes .gitlab-ci.yml and failed job logs, finds the root cause of a
      pipeline failure and proposes a concrete fix.
    tools: [Read, Bash, Grep, Glob]
    model: sonnet
    body: |
      # GitLab Pipeline Debugger

      ## How to work

      1. Read the whole `.gitlab-ci.yml` (and anything it pulls in via
         `include:`) - the bug is often in how stages interact (e.g. an
         artifact from a previous job doesn't exist in the next one), not
         in a single line.
      2. If you're given a failed job's log (pasted by the user or a file),
         find the FIRST error, not the last - the cascade of errors after
         the first failure is usually noise.
      3. Common causes to check first:
         - misconfigured `rules:`/`only`/`except` - a job doesn't run where
           it should, or runs where it shouldn't,
         - a missing `artifacts:`/`needs:` between jobs that should share
           files (e.g. `target/*.jar` from `build` to `deploy`),
         - cache (`cache: key:`) using the wrong key, so a job gets stale
           or wrong cache,
         - CI/CD variables (`variables:`, CI/CD Settings) - a typo in the
           name, missing `protected`/`masked` where it should be set.
      4. Propose a minimal YAML change, don't rewrite the whole file - a
         pipeline is usually shared ownership across the whole team.

      ## Output format

      A diagnosis (1-3 sentences, what actually happened), the YAML
      fragment to change (before/after), one sentence on how to verify it
      (e.g. `glab ci lint` if available, or a push to a test branch).

  - id: jira-ticket-assistant
    description: >-
      Writes Jira ticket descriptions and updates based on commits and code
      changes, and enforces the smart-commit format (e.g. "PROJ-123
      #comment ..."). Has no direct Jira access unless you enable the MCP
      integration (see docs/mcp-integrations.md).
    tools: [Read, Bash, Grep]
    model: sonnet
    body: |
      # Jira Ticket Assistant

      Without the MCP integration enabled, you act as a "content writer" -
      you produce text the user pastes into Jira themselves. With the MCP
      integration enabled (the `atlassian` server) you can read/write
      tickets directly - always show the user the exact content you're
      about to write BEFORE writing it.

      ## How to work

      1. Pull the ticket number from the branch name (`PROJ-123-something`),
         the commit message, or ask directly if it isn't obvious.
      2. **Smart commits** (if this repo's GitLab-Jira integration is
         enabled): the format is `PROJ-123 #comment short comment text`, or
         `PROJ-123 #time 2h #comment ...`, or `PROJ-123 #done`. Check
         whether commit messages in the diff/log follow this format IF the
         project uses it - don't force it on a project that doesn't.
      3. Write ticket updates/comments from the perspective of someone
         reading the ticket later (say, six months from now), not from the
         perspective of "what's in the diff" - say WHY the change happened,
         not just what changed (that's visible in the MR).
      4. Never invent acceptance-criteria content or ticket status you
         haven't seen - if you don't have access (MCP disabled), say so
         plainly and ask for the ticket content to be pasted in.

  - id: docker-reviewer
    description: >-
      Reviews Dockerfile and docker-compose.yml for security, image size,
      non-root user, and version pinning.
    tools: [Read, Grep, Glob]
    model: sonnet
    body: |
      # Docker Reviewer

      ## Dockerfile checklist

      - **Non-root**: does the final image run as a `USER` other than
        root? No `USER` in the Dockerfile = the container runs as root.
      - **Base image version pinning**: `FROM eclipse-temurin:21-jre` is
        fine, `FROM eclipse-temurin:latest` is not (non-deterministic
        builds, silent Java version upgrades).
      - **Multi-stage build**: for Java/Spring - is there a separate build
        stage (Maven/Gradle + full JDK) and a separate, smaller runtime
        stage (JRE only) - the build tools and full JDK shouldn't end up
        in the production image.
      - **Layer cache**: is `COPY pom.xml .` + `RUN mvn dependency:go-offline`
        BEFORE `COPY src/`, so a code change doesn't invalidate the
        dependency cache on every build?
      - **Secrets in layers**: `ARG`/`ENV` with passwords/tokens end up in
        the image's layer history even after being "removed" in a later
        RUN - use build secrets (`--mount=type=secret`) or inject at
        runtime, never `ARG DB_PASSWORD`.
      - **`.dockerignore`**: does it exist and exclude `.git`, `target/`,
        `.env` - without it: bigger build contexts and a risk of
        accidentally including secrets.

      ## docker-compose.yml checklist

      - Ports exposed on `0.0.0.0` (the default) for services that should
        only be reachable inside the compose network (e.g. a database) -
        should have no `ports:` section, or be bound to `127.0.0.1`.
      - Passwords/secrets set directly under `environment:` instead of a
        (git-ignored) `.env` file or `secrets:`.
      - Missing `healthcheck:` for services other services depend on (e.g.
        a database the app depends on) - `depends_on` without
        `condition: service_healthy` only guarantees the process started,
        not that the dependency is actually READY.
      - Images without a pinned version (`image: postgres` instead of
        `image: postgres:16`).

  - id: release-notes-writer
    description: >-
      Generates a changelog/release notes from `git log` and linked Jira
      tickets (numbers pulled from commits/branch names).
    tools: [Read, Bash, Grep]
    model: sonnet
    body: |
      # Release Notes Writer

      ## How to work

      1. `git log <previous-tag>..HEAD --oneline` (or the range the user
         gives you) - that's your raw material.
      2. Pull Jira ticket numbers out of commit messages/branch names
         (pattern `[A-Z]+-\d+`).
      3. Group changes by theme: New / Fixes / Technical changes
         (refactoring, dependency upgrades) - don't copy commit messages
         1:1, they're written for developers and release notes are often
         read by someone else.
      4. Each bullet: what changed from a user's/operator's perspective
         (not "changed method X in class Y"), linking the ticket if known.
      5. If a commit has no clear connection to visible functionality
         (e.g. "fix typo", "wip"), skip it in the release notes or group
         several of them together as "minor fixes" - don't pad the list.

      ## Output format

      ```markdown
      ## [version] - YYYY-MM-DD

      ### New
      - ...

      ### Fixes
      - ...

      ### Technical changes
      - ...
      ```

# ---------------------------------------------------------------------------
# Skills
# ---------------------------------------------------------------------------
skills:
  - id: springboot-patterns
    description: >-
      Spring Boot design patterns - layering, DTOs, exception handling,
      configuration. Use when creating a new endpoint, service, or Spring
      component.
    body: |
      # Spring Boot - patterns

      ## Layering
      Controller -> Service -> Repository. Controller: only maps HTTP <->
      DTO and calls the service, zero business logic. Service: business
      logic + transaction boundaries (`@Transactional`). Repository: only
      data access (Spring Data JPA interfaces; if raw SQL is needed -
      `@Query` with a bound parameter, never string concatenation).

      ## DTOs instead of entities at the API boundary
      Never return a JPA `@Entity` directly from a controller. Use a
      record as a DTO:
      ```java
      public record TaskResponse(Long id, String title, boolean done) {
          static TaskResponse from(Task t) {
              return new TaskResponse(t.getId(), t.getTitle(), t.isDone());
          }
      }
      ```

      ## Exception handling
      A global `@ControllerAdvice` instead of try/catch in every controller:
      ```java
      @ControllerAdvice
      class ApiExceptionHandler {
          @ExceptionHandler(EntityNotFoundException.class)
          ResponseEntity<ProblemDetail> notFound(EntityNotFoundException e) {
              return ResponseEntity.status(404)
                  .body(ProblemDetail.forStatusAndDetail(HttpStatus.NOT_FOUND, e.getMessage()));
          }
      }
      ```

      ## Configuration
      `@ConfigurationProperties` instead of `@Value` scattered across the
      codebase, once you have more than 2-3 config fields.

  - id: springboot-security
    description: >-
      Spring security - authentication, authorization, validation, secrets,
      headers. Use when adding auth, handling user input, creating an
      endpoint, or managing secrets.
    body: |
      # Spring Boot - security

      ## Method-level authorization
      ```java
      @PreAuthorize("hasRole('ADMIN') or #userId == authentication.name")
      @DeleteMapping("/{userId}")
      void deleteUser(@PathVariable String userId) { ... }
      ```

      ## Secrets - never in code
      `application.properties`:
      ```properties
      spring.datasource.password=${DB_PASSWORD}
      payment.gateway.secret=${PAYMENT_GATEWAY_SECRET}
      ```
      Not: `payment.gateway.secret=sk_live_...` written directly in the file.

      ## Input validation
      ```java
      public record NewTaskRequest(@NotBlank @Size(max = 200) String title) {}
      ```
      `@Valid @RequestBody NewTaskRequest request` in the controller - Bean
      Validation won't fire without it.

      ## CORS - specific origins, never `*` with `allowCredentials(true)`
      ```java
      registry.addMapping("/api/**")
          .allowedOrigins("https://app.example.com")
          .allowCredentials(true);
      ```

      ## SQL/JPQL - always a bound parameter
      ```java
      // BAD: jdbcTemplate.queryForList("SELECT * FROM task WHERE title LIKE '%" + name + "%'")
      // OK:
      jdbcTemplate.queryForList(
          "SELECT * FROM task WHERE title LIKE ?", "%" + name + "%");
      ```

  - id: springboot-tdd
    description: >-
      Writing tests for Spring Boot code - JUnit 5, MockMvc, @DataJpaTest,
      Testcontainers. Use when writing new functionality or when existing
      code is missing tests.
    body: |
      # Spring Boot - TDD

      ## Web layer (controller) test - `@WebMvcTest`
      ```java
      @WebMvcTest(TaskController.class)
      class TaskControllerTest {
          @Autowired MockMvc mvc;
          @MockBean TaskRepository repo;

          @Test
          void returns404ForMissingTask() throws Exception {
              when(repo.findById(1L)).thenReturn(Optional.empty());
              mvc.perform(get("/api/tasks/1")).andExpect(status().isNotFound());
          }
      }
      ```

      ## Data layer test - `@DataJpaTest`
      Uses in-memory H2 or (better for parity with a production Postgres)
      Testcontainers. `@DataJpaTest` automatically rolls back after each
      test - no need to clean up data by hand.

      ## Rule of thumb
      Name the test after the behavior, not the method:
      `returns404ForMissingTask`, not `testFindById1`. One test = one
      behavior = one real "what happens if..." question.

  - id: database-migrations
    description: >-
      Database migrations in Spring Boot (Flyway/Liquibase). Use when
      changing the database schema - a new table, column, or index.
    body: |
      # Database migrations

      `spring.jpa.hibernate.ddl-auto=update` is fine for local
      development/a sandbox, NEVER on an environment with real data -
      Hibernate can silently make a change you didn't expect (e.g. drop a
      column).

      ## Flyway
      File `src/main/resources/db/migration/V{n}__description.sql`,
      increasing numbers, NEVER edit an already-applied migration - add a
      new one.
      ```sql
      -- V5__add_task_priority.sql
      ALTER TABLE task ADD COLUMN priority VARCHAR(20) NOT NULL DEFAULT 'normal';
      ```

      ## Safe schema changes (no downtime)
      Adding a NOT NULL column to a table with data = two steps: (1) add
      the column as nullable with a default, deploy, (2) after the
      backfill, add the NOT NULL constraint in a separate migration. Doing
      it in one step risks a lock on a large table during deployment.

  - id: git-workflow
    description: >-
      Commit and git-usage conventions - messages, branching, rebase vs
      merge. Use when creating a commit, a branch, or preparing history for
      an MR.
    body: |
      # Git conventions

      ## Commit messages
      Format: `type(scope): short imperative description`, e.g.
      `fix(task-api): fix SQL injection in task search`.
      Types: `feat`, `fix`, `refactor`, `test`, `docs`, `chore`, `ci`.
      Commit body (if needed): WHY, not just what - "what" is visible in
      the diff.

      ## Branches
      `<type>/<ticket-number>-short-description`, e.g.
      `feat/PROJ-123-delete-task`. Ticket number at the start of the branch
      name - GitLab-Jira integrations and many CI tools pull it from there.

      ## Rebase vs merge
      Locally, before opening an MR: `git rebase -i` to clean up history
      (squash "wip", "fix typo", etc.) - it's your branch, nobody else is
      working on it. Once an MR is open and review has started: do NOT
      rebase commits someone is already reviewing (force-pushing mid-review
      loses the reviewer's context) - add new commits instead, squash only
      at merge time (GitLab: "Squash commits" in the MR settings).

  - id: gitlab-mr-workflow
    description: >-
      GitLab Merge Request hygiene - description, ticket linking, draft vs
      ready. Use when preparing or reviewing an MR.
    body: |
      # GitLab - Merge Request workflow

      ## Draft vs ready
      An MR in progress -> title prefixed with `Draft:` (GitLab recognizes
      this prefix and blocks the merge until it's removed). Don't open an
      MR as "ready for review" if you wouldn't approve it yourself yet.

      ## Linking a ticket
      In the MR description: `Closes PROJ-123` (or `Relates to` if the MR
      doesn't close the whole ticket) - GitLab links it automatically and
      (with the Jira integration) can auto-transition the ticket to "Done"
      on merge.

      ## MR size
      Small MRs (roughly under ~400 lines of diff) get faster and more
      thorough reviews than large ones. If the task is genuinely large,
      consider splitting it into several MRs that build on each other
      (stacked MRs) instead of one huge one.

  - id: gitlab-ci-patterns
    description: >-
      Writing and debugging .gitlab-ci.yml - stages, cache, rules,
      artifacts. Use when creating or fixing a CI pipeline.
    body: |
      # GitLab CI - patterns

      ## Basic structure
      ```yaml
      stages: [build, test, deploy]

      build:
        stage: build
        image: maven:3.9-eclipse-temurin-21
        script:
          - mvn -B -DskipTests package
        artifacts:
          paths: [target/*.jar]
          expire_in: 1 hour
        cache:
          key: "${CI_COMMIT_REF_SLUG}-maven"
          paths: [.m2/repository]
      ```

      ## `rules:` instead of the deprecated `only`/`except`
      ```yaml
      deploy:
        stage: deploy
        rules:
          - if: '$CI_COMMIT_BRANCH == "main"'
        script: [...]
      ```

      ## Cache must be per-branch
      `key: "${CI_COMMIT_REF_SLUG}-maven"`, not a fixed string - otherwise
      parallel pipelines on different branches overwrite each other's cache.

      ## `needs:` to speed up the pipeline
      By default stages wait for each other in order. `needs: [build]` on a
      test job lets it start right after `build` finishes, without waiting
      for the rest of the `build` stage (if there are other parallel jobs).

  - id: jira-workflow
    description: >-
      Jira hygiene - smart commits, status transitions, linking. Use when
      referencing a Jira ticket in a commit, an MR, or a conversation.
    body: |
      # Jira - workflow

      ## Smart commits (if the GitLab-Jira integration is enabled)
      `PROJ-123 #comment a short comment` in a commit message adds a
      comment to the ticket. `PROJ-123 #time 1h 30m #comment ...` logs
      time. `PROJ-123 #done` moves the ticket to a "done" status (if the
      project's workflow allows it).

      ## Reference without an action
      Just `PROJ-123` in a commit/MR links it without triggering any
      action - a safe default if you're not sure you want to trigger an
      automatic status change.

      ## What NOT to auto-write to Jira
      Never move a ticket to "Done"/"Closed" based on a merge alone,
      without confirming the change actually reached the environment the
      ticket was meant to cover (staging/production) - "Done" in Jira is
      usually a promise to the business, not a technicality.

  - id: docker-patterns
    description: >-
      Good Dockerfile practices for Java/Spring applications - multi-stage
      builds, caching, non-root. Use when creating/changing a Dockerfile.
    body: |
      # Docker - patterns for Java/Spring

      ## Multi-stage build
      ```dockerfile
      FROM maven:3.9-eclipse-temurin-21 AS build
      WORKDIR /app
      COPY pom.xml .
      RUN mvn -q dependency:go-offline
      COPY src ./src
      RUN mvn -q -DskipTests package

      FROM eclipse-temurin:21-jre
      RUN useradd --system --create-home appuser
      USER appuser
      WORKDIR /app
      COPY --from=build /app/target/*.jar app.jar
      ENTRYPOINT ["java", "-jar", "app.jar"]
      ```
      The order `COPY pom.xml` -> `dependency:go-offline` -> `COPY src`
      uses Docker's layer cache: a code change doesn't invalidate the
      downloaded dependencies.

      ## Non-root user
      The final image always has an explicit `USER` other than root (see
      the example above) - a container with no `USER` runs as root by
      default.

  - id: docker-compose-patterns
    description: >-
      Local development environments with docker compose - healthchecks,
      networks, profiles. Use when creating/changing docker-compose.yml.
    body: |
      # docker compose - patterns

      ## Healthcheck + `depends_on: condition`
      ```yaml
      services:
        db:
          image: postgres:16
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app"]
            interval: 5s
            timeout: 3s
            retries: 10
        app:
          build: .
          depends_on:
            db:
              condition: service_healthy
      ```
      `depends_on: [db]` alone (without `condition`) only guarantees
      process start order, not that the database is actually ready to
      accept connections - the app can start and immediately fail on its
      first connect.

      ## Secrets - `.env` outside git, not `environment:` directly
      ```yaml
      services:
        app:
          env_file: .env   # .env in .gitignore
      ```

      ## Ports - don't expose what doesn't need to be on the host
      A database only needed by other services in the same compose network
      doesn't need a `ports:` section - `expose:` (or nothing - the
      default compose network already connects the services) is enough.

# ---------------------------------------------------------------------------
# Commands
# ---------------------------------------------------------------------------
commands:
  - id: plan
    description: "Break a task into implementation steps before writing code"
    argument_hint: "[task description]"
    body: |
      # /plan

      **Task**: $ARGUMENTS

      Use the `planner` agent to break the task above into small,
      verifiable steps. Read the relevant code first (controllers,
      services, `pom.xml`, `.gitlab-ci.yml`, `docker-compose.yml` -
      whatever the task calls for) before proposing a plan. End with a plan
      to be approved, not an immediate implementation.

  - id: code-review
    description: "Code review of local changes or a Merge Request"
    argument_hint: "[optional: MR number/URL]"
    body: |
      # /code-review

      **Argument**: $ARGUMENTS

      If the argument looks like a GitLab Merge Request number/URL - and
      the `gitlab` MCP integration is enabled - fetch that MR's diff.
      Otherwise: `git diff` (local, uncommitted changes).

      Run the following, depending on what the diff touches:
      - changes under `src/main/java/**` -> the `spring-reviewer` agent,
        and if the diff touches endpoints/auth/secrets/sensitive data ->
        also `spring-security-reviewer`,
      - changes to `Dockerfile`/`docker-compose*.yml` -> the
        `docker-reviewer` agent,
      - changes to `.gitlab-ci.yml` -> the `gitlab-pipeline-debugger` agent
        (in review mode, not just failure debugging).

      Merge the results into one list, sorted by severity.

  - id: mr-prepare
    description: "Prepare a Merge Request - review the changes + draft the description"
    argument_hint: "[optional: extra context about the changes]"
    body: |
      # /mr-prepare

      **Context from the user**: $ARGUMENTS

      Use the `gitlab-mr-reviewer` agent on the current diff
      (`git diff <target-branch>...HEAD` - ask for the target branch if
      it's not obvious). Return: a list of notes on the changes (if any)
      plus a ready draft MR description following that agent's template.
      If the `gitlab` MCP integration is enabled, ask whether to open the
      MR directly instead of just preparing the text.

  - id: pipeline-debug
    description: "Diagnose a failed GitLab CI pipeline"
    argument_hint: "[optional: failed job URL/ID, or a pasted log]"
    body: |
      # /pipeline-debug

      **Context (URL/ID/log)**: $ARGUMENTS

      Use the `gitlab-pipeline-debugger` agent. If the `gitlab` MCP
      integration is enabled, try to fetch the failed job's log through
      it; otherwise ask the user to paste the log. Read the whole
      `.gitlab-ci.yml` before making a diagnosis.

  - id: jira-sync
    description: "Prepare/apply a Jira ticket update based on the changes"
    argument_hint: "[ticket number, e.g. PROJ-123]"
    body: |
      # /jira-sync

      **Ticket**: $ARGUMENTS

      Use the `jira-ticket-assistant` agent. Gather context from `git log`
      for commits referencing this ticket number. If the `atlassian` MCP
      integration is enabled - show the user the exact content you're
      about to write to Jira and wait for confirmation before writing it.
      Without the integration - return ready-to-paste text.

  - id: tdd
    description: "Generate tests for the given class/method"
    argument_hint: "[class/method to test]"
    body: |
      # /tdd

      **Target**: $ARGUMENTS

      Use the `springboot-tdd` skill. Read the code to be tested (and its
      direct dependencies) first, then write tests - named after the
      behavior, not the method name. Pick the right test type for the
      layer: `@WebMvcTest` for a controller, `@DataJpaTest` for a
      repository, plain JUnit + Mockito for a plain service with no
      Spring dependencies.

  - id: docker-audit
    description: "Review Dockerfile/docker-compose for security and quality"
    argument_hint: "[optional: path to the Dockerfile/compose file]"
    body: |
      # /docker-audit

      **Path (optional)**: $ARGUMENTS

      Use the `docker-reviewer` agent on the given file (or find
      `Dockerfile`/`docker-compose*.yml` in the repo if no path is given).
      Go through the agent's checklist point by point - don't skip a
      section just because the first few findings already look serious
      enough.

  - id: release-notes
    description: "Generate release notes from commit history"
    argument_hint: "[range, e.g. v1.2.0..HEAD]"
    body: |
      # /release-notes

      **Range**: $ARGUMENTS

      Use the `release-notes-writer` agent. If no range is given, ask for
      the last tag (`git describe --tags --abbrev=0`) and use
      `<last-tag>..HEAD`.

# ---------------------------------------------------------------------------
# Rules - always loaded into context
# ---------------------------------------------------------------------------
rules:
  - id: java
    description: "Java/Spring Boot conventions that apply in every session"
    body: |
      - Constructor injection, never field `@Autowired`.
      - A controller never returns a JPA entity directly - always a DTO/record.
      - SQL/JPQL queries always use a bound parameter, never string
        concatenation.
      - `@Transactional` on the service layer, not the controller or the
        repository.
      - New `@RequestBody` fields get Bean Validation (`@NotBlank`,
        `@Size`, ...) and `@Valid` on the controller method signature.
      - A database schema change means a Flyway/Liquibase migration, never
        relying on `ddl-auto=update` outside local development.

  - id: gitlab-ci
    description: "Rules for writing .gitlab-ci.yml that apply in every session"
    body: |
      - `rules:` instead of the deprecated `only`/`except`.
      - The cache key always includes `${CI_COMMIT_REF_SLUG}` - never a
        fixed string.
      - Every job that changes external state (deploy) has an explicit
        `rules:` restricting the branch/tag - never runs "everywhere by
        default".
      - Secrets always go through CI/CD Variables (marked
        `protected`/`masked` where relevant), never directly in
        `.gitlab-ci.yml`.

  - id: docker
    description: "Dockerfile/docker-compose conventions that apply in every session"
    body: |
      - Every final image has an explicit `USER` other than root.
      - Base image versions are always pinned (a specific version tag, not
        `latest`).
      - Multi-stage build for Java/Spring applications - build tools (full
        Maven/JDK) never end up in the final image.
      - No secret ever goes into `ARG`/`ENV`/an image layer - use build
        secrets or inject at runtime.
      - `docker-compose.yml`: healthcheck + `depends_on: condition:
        service_healthy` for dependencies that must be READY, not just
        started.

  - id: git
    description: "Commit and branch conventions that apply in every session"
    body: |
      - Commit message: `type(scope): imperative description` (`feat`,
        `fix`, `refactor`, `test`, `docs`, `chore`, `ci`).
      - Branch name: `<type>/<ticket-number>-short-description`.
      - Force-push only on your own working branch before opening an MR,
        never on `main`/`master`/`release/*` (see the
        `block-force-push-protected` hook).

# ---------------------------------------------------------------------------
# Hooks - automations on tool events. Scripts live in static/hooks/<script>
# and are copied 1:1 into the generated repo.
# ---------------------------------------------------------------------------
hooks:
  - id: block-force-push-protected
    event: PreToolUse
    matcher: Bash
    description: "Blocks force-push to protected branches (main/master/release/*)"
    script: block-force-push-protected.sh
    timeout: 10

  - id: secret-scan
    event: PreToolUse
    matcher: "Write|Edit"
    description: "Blocks writing content that looks like a secret (AWS key, private key, hardcoded API key)"
    script: secret-scan.sh
    timeout: 10

  - id: gitlab-ci-lint
    event: PostToolUse
    matcher: "Write|Edit"
    description: "Checks YAML syntax after editing .gitlab-ci.yml"
    script: gitlab-ci-lint.sh
    timeout: 15

  - id: compose-validate
    event: PostToolUse
    matcher: "Write|Edit"
    description: "Validates docker-compose.yml via `docker compose config` after editing"
    script: compose-validate.sh
    timeout: 20
